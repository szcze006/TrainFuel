name: Sprint 4 SonarQube PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sprint4_sonar_pdf.py

permissions:
  contents: write

jobs:
  sonar-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TrainFuel
        uses: actions/checkout@v4
      - name: Build SonarQube PDF from recorded dashboard metrics
        run: |
          python -m pip install --quiet reportlab
          python scripts/sprint4_sonar_pdf.py
      - name: Upload SonarQube PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprint4-sonarqube-pdf
          path: docs/Sprint-4-Static-Analysis/SonarQube-Report.pdf
      - name: Commit SonarQube PDF into repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/Sprint-4-Static-Analysis/SonarQube-Report.pdf
          git diff --cached --quiet || (git commit -m 'Add Sprint 4 SonarQube dashboard summary PDF' && git push)
